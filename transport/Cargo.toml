[package]
name = "tonic-ws-transport"
version = "0.1.0"
authors = ["boxdot <d@zerovolt.org>"]
edition = "2021"

[features]
default = ["native"]
native = [
    "hyper",
    "tokio-tungstenite",
    "tokio/net",
    "tonic/transport",
    "tower",
    "headers",
]
web = [
    "getrandom",
    "js-sys",
    "tokio/sync",
    "tower",
    "tower/load",
    "tower/limit",
    "tower/util",
    "tower/buffer",
    "tower/balance",
#    "tower/make",
    "tonic",
    "wasm-bindgen",
    "wasm-bindgen-futures",
    "web-sys",
    "hyper/client",
    "hyper/http2",
    "hyper-util/http2",
    "hyper-util/tokio",
#    "hyper-util/client"
]

[dependencies]
bytes = "1.0.1"
cfg-if = "1.0.0"
futures-util = { version = "0.3.12", default-features = false, features = ["sink"] }
http = "1"
pin-project = "1.0.5"
thiserror = "1.0.23"
tokio = { version = "1.34.0", default-features = false, features = ["rt"] }
tokio-util = { version = "0.6.3", default-features = false, features = ["io"] }
tracing = "0.1"
tower = { version = "0.5.2", default-features = false, optional = true }
tokio-stream = "0.1"
tower-service = "0.3.3"
tungstenite = { version = "0.23", default-features = false }

# native
hyper = { version = "1", default-features = false, optional = true }
hyper-util = "0.1"
tokio-tungstenite = { version = "0.23", optional = true }
tonic = { version = "0.14.1", default-features = false, features = [], optional = true }
headers = { version = "0.4.0", optional = true }

# web
getrandom = { version = "0.2.2", features = ["js"], optional = true }
js-sys = { version = "0.3.47", optional = true }
wasm-bindgen = { version = "0.2.70", optional = true }
wasm-bindgen-futures = { version = "0.4.20", optional = true }
web-sys = { version = "0.3.47", features = ["WebSocket", "BinaryType", "MessageEvent"], optional = true }
