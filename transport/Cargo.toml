[package]
name = "tonic-ws-transport"
version = "0.1.0"
authors = ["boxdot <d@zerovolt.org>"]
edition = "2021"

[features]
default = []

[dependencies]
bytes = "1.0.1"
cfg-if = "1.0.0"
futures-util = { version = "0.3.12", default-features = false, features = ["sink"] }
http = "1"
pin-project = "1.0.5"
thiserror = "1.0.23"
tokio = { version = "1.34.0", default-features = false, features = ["rt"] }
tokio-util = { version = "0.6.3", default-features = false, features = ["io"] }
tracing = "0.1"
tower-service = "0.3.3"
tungstenite = { version = "0.23", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.34.0", default-features = false, features = ["rt", "net"] }
tower = { version = "0.5.2", default-features = false }
hyper = { version = "1", default-features = false }
hyper-util = "0.1"
tokio-tungstenite = { version = "0.23" }
tonic = { version = "0.14.1", default-features = false, features = ["transport"] }
headers = { version = "0.4.0" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1.34.0", default-features = false, features = ["rt", "sync"] }
tower = { version = "0.5.2", default-features = false, features = ["load", "limit", "util", "buffer", "balance"] }
tokio-stream = "0.1"
hyper = { version = "1", default-features = false, features = ["client", "http2"] }
hyper-util = { version = "0.1", default-features = false, features = ["http2", "tokio"] }
getrandom = { version = "0.2.2", features = ["js"] }
js-sys = { version = "0.3.47" }
tonic = { version = "0.14.1", default-features = false }
wasm-bindgen = { version = "0.2.70" }
wasm-bindgen-futures = { version = "0.4.20" }
web-sys = { version = "0.3.47", features = ["WebSocket", "BinaryType", "MessageEvent"] }
